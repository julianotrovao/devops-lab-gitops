apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-alomundo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        # Caminho do seu repositório específico
        image: 017121235801.dkr.ecr.us-east-1.amazonaws.com/treinamento/devops-repo:latest
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"